]

[metadata]
author_name = "Daniel Ribeiro"
author_email = "thomasli921215@gmail.com"
author_organization = "FILL IN: your university, institute, lab or employer, or exactly \"Independent Researcher\""
author_profile = "FILL IN: Google Scholar, personal site or LinkedIn URL"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "earth-sciences"
field = "atmospheric-sciences"
