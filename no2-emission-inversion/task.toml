relevant_experience = "FILL IN: your own background in satellite trace-gas retrievals and/or emission inverse modeling, naming the products, models and studies you have worked on."
difficulty_explanation = """
The data are synthetic and disclosed as such. A seeded generator, implemented
independently of the reference solution, integrates the truth on a 2 km grid
and samples it onto the published 4 km inference grid; the latent parameters
were fixed before any inversion was attempted, and the representation error
between the grids is measured and published as a floor plus a relative term so
no fair solution is penalised for discretisation.

Three things make this hard, and they compound.

The chemistry does not superpose. The NOx sink saturates as the oxidant that
removes it is suppressed, L(C) = C P / (tau0 (1 + C / C_ref)), so the column
from two sources together is not the sum of the columns each produces alone.
There is no basis decomposition and no inner linear least squares: all fifteen
unknowns go through a nonlinear fit, the inflow background lengthens the
lifetime of the emitted plumes, and the loss parameters trade against emission
amplitude along a genuinely degenerate direction.

The quality flag is not an artefact detector. A contiguous band of across-track
positions develops a gain and offset error partway through the record, as real
ultraviolet imagers do. It passes the quality screen and the reported per-pixel
uncertainty does not cover it. The specification states that the flag is not
exhaustive and that establishing which retrievals are fit to use is part of the
analysis; it does not say which positions or from when. Fitting the accepted
set as delivered gives a training chi-square per observation of 2.19 instead of
0.96, which is the only signal that anything is wrong, and costs a factor of
three on held-out satellite skill. Finding the band takes a fit, then residuals
binned by across-track index and episode, then another fit.

The withheld episodes are not a rerun of the observed ones. They span a wider
range of day-type emission factors, so a saturation column calibrated only over
the observed concentration range extrapolates badly.

The rest of the chain still bites: two emission fields on different mass bases,
a boundary-layer mean wind formed before interpolating rather than after, an
unknown rotation composed with the spatially varying grid convergence, a
conservative transport solve with the unknown inflow as both initial and
boundary condition, area-weighted polygon footprints with a per-pixel vertical
sensitivity, and a surface operator through a vertical profile whose shape
parameter is itself unknown, which forces the column and surface data to be
used together. Every one of those was broken in turn, refitted end to end and
scored; the measurements are in authoring/evidence/EVIDENCE.md.
"""

solution_explanation = """
The saturating sink removes any basis decomposition, so all fifteen unknowns
are fitted jointly by bounded nonlinear least squares with a finite-difference
Jacobian, the forward runs for the twelve observed episodes distributed over
the available cores. Transport is a flux-form finite-volume scheme with a van
Leer limited reconstruction at a 60 s step, first order at boundary faces, the
inflow background in the ghost cells and zero diffusive flux across the
boundary; the loss coefficient is evaluated at the current column and applied
as an exponential update.

The instrument artefact is found the way an analyst finds it, and without
reading the generator: fit once over the whole accepted set, take the median
normalised residual at each across-track position within each episode, compare
it with the upper quartile over positions so that a poor global fit shifts
everything together and flags nothing, and act only on maximal contiguous runs
of flagged positions. Three rounds of screen-and-refit converge, dropping
exactly the affected retrievals and bringing the training chi-square per
observation from 2.19 to 0.96. A restart from a distant point checks the
optimiser has not stopped in a local minimum. The fitted parameters are then
propagated through the six withheld episodes.
"""

verification_explanation = """
Ground truth comes from the generator in authoring/provenance, a separate
implementation from the reference solution, run once on a finer grid with
latent parameters chosen in advance. Its withheld observation values are baked
into the verifier image and never appear in the environment.

The verifier applies five mandatory gates and awards reward 1 only when all
pass. It checks file schemas, units, dimensions and query coverage; that the
reported parameters lie inside the published bounds and that the inflow field
is non-negative across the domain; that the exported flux fields and the
reported episode totals follow exactly from the reported scale factors, which
is where a wrong emission mass basis or a mis-scaled non-road field is caught;
that an independent forward recomputation of the submitted parameters, written
with a different discretisation, reproduces the submitted predictions; and that
the withheld satellite and surface observations are predicted within frozen
error-normalised thresholds, globally and within each of the three wind regimes
separately.

There is deliberately no gate on the absolute road emission total or on the
individual chemistry parameters. The identifiability study showed the public
data do not constrain them: emission amplitude, reference loss time and
saturation column trade against one another with almost no change in the fit,
while the wind correction and the vertical shape parameter are recovered to a
fraction of a percent. Grading a quantity the data do not determine would fail
correct work, so prediction agreement carries the evidence.

Thresholds are a fixed margin above measured reference performance, 1.75 times
on satellite and 1.45 times on station, applied to the global and per-regime
scores alike, and then validated against the broken variants: each of the four
that must fail is rejected by at least one gate. Setting the margin from the
reference and checking it against the broken set, rather than placing it
between them, keeps a correct solution with different numerics safely inside.
Nineteen adversarial outputs were run against the verifier and all scored 0.
"""


[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

